[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cricscore"
version = "0.0.1"
description = "A polished terminal UI for ESPNCricinfo match scorecards."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "himzterr" }]
keywords = ["cricket", "tui", "textual", "espncricinfo", "scorecard"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "textual>=0.80,<1.0",
    "rich>=13.7",
    "curl-cffi>=0.7",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
cricscore = "cricscore.cli:app"

[project.urls]
Repository = "https://github.com/himzterr/CricScore"

[tool.hatch.build.targets.wheel]
packages = ["src/cricscore"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
